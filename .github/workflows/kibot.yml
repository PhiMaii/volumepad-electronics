name: KiBot

on:
  push:
    branches:
      - v2-redesign
    paths:
      - 'pcb/**'
      - 'config.kibot.yaml'
      - '.github/workflows/kibot.yml'

  pull_request:
    paths:
      - 'pcb/**'
      - 'config.kibot.yaml'
      - '.github/workflows/kibot.yml'

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run KiBot
        uses: INTI-CMNB/KiBot@v2_k8
        with:
          config: config.kibot.yaml
          dir: output
          schema: pcb/volumepad-stm32-pcb.kicad_sch
          board: pcb/volumepad-stm32-pcb.kicad_pcb
          skip: all

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: volumepad-kibot-output
          path: output
